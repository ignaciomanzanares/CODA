# ============================================
# Render Blueprint - CODA Backend
# ============================================
# This file configures Render deployment
# Docs: https://render.com/docs/blueprint-spec
# ============================================

services:
  # CODA API Backend
  - type: web
    name: coda-api
    runtime: node
    region: virginia  # Match your database region
    plan: free  # Change to 'starter' or higher for production
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGINS
        value: https://coda-web-steel.vercel.app
      - key: DEBUG_ENDPOINTS
        value: false
      # Database URL - automatically injected from Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: coda-db
          property: connectionString
      # JWT Secret - set manually in Render Dashboard for security
      - key: JWT_SECRET
        sync: false  # Must be set manually in dashboard

databases:
  # PostgreSQL Database
  - name: coda-db
    plan: free  # Change to 'starter' or higher for production
    region: virginia
    postgresMajorVersion: 15
    # ipAllowList: []  # Uncomment to restrict access
