# ============================================
# Render Blueprint - CODA Backend
# ============================================
# This file configures Render deployment
# Docs: https://render.com/docs/blueprint-spec
# ============================================

services:
  # CODA API Backend
  - type: web
    name: coda-api
    runtime: node
    region: virginia
    plan: free  # Change to 'starter' or higher for production
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w @coda/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGINS
        value: https://www.codafinance.cl,https://codafinance.cl
      - key: CLIENT_URL
        value: https://www.codafinance.cl
      - key: DEBUG_ENDPOINTS
        value: false
      - key: DEMO_MODE
        value: true  # Set to false for real production deployment
      # DATABASE_URL must be set manually in Render Dashboard (Neon pooled URL)
      - key: DATABASE_URL
        sync: false
      # JWT Secret - set manually in Render Dashboard for security
      - key: JWT_SECRET
        sync: false  # Must be set manually in dashboard
