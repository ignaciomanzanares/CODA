services:
  # PostgreSQL Database
  - type: pserv
    name: finhealth-db
    env: docker
    plan: free
    region: oregon
    databaseName: finhealth
    databaseUser: finhealth
    ipAllowList: []

  # Web Service (Backend + Frontend)
  - type: web
    name: finhealth-app
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finhealth-db
          property: connectionString
      - key: AUTH0_ISSUER_BASE_URL
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_M2M_CLIENT_ID
        sync: false
      - key: AUTH0_M2M_CLIENT_SECRET
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_REDIRECT_URI
        sync: false
    healthCheckPath: /
