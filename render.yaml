# ============================================
# Render Blueprint - CODA Backend
# ============================================
# This file configures Render deployment
# Docs: https://render.com/docs/blueprint-spec
# ============================================

services:
  # Redis (Render Key Value) — rate limiting distribuido y colas de trabajo (BullMQ).
  # Si no se provisiona, la API cae a rate limiting en memoria de un solo proceso (ver
  # src/middleware/rateLimiter.ts) — funciona en dev, no escala a múltiples instancias.
  - type: keyvalue
    name: coda-redis
    region: virginia
    plan: starter  # free tier no persiste de forma confiable entre restarts — ver docs/DISASTER_RECOVERY.md
    ipAllowList: []

  # CODA API Backend
  - type: web
    name: coda-api
    runtime: node
    region: virginia
    plan: starter  # free tier sleeps on inactivity — incompatible with an RTO target (ver docs/DISASTER_RECOVERY.md)
    # Escalado (#38): instancias fijas por defecto. Para autoscaling, subir de plan y descomentar
    # `scaling`. Criterio sugerido: escalar OUT al 70% de CPU sostenido (los picos pesados son
    # OCR/parseo, que ya viven en el worker aparte). El pool de Postgres por instancia es
    # PG_POOL_MAX (default 8) → mantener numInstances * PG_POOL_MAX ≤ límite de conexiones de Neon.
    numInstances: 1
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetCPUPercent: 70
    buildCommand: npm install --include=dev && npm run build
    # Aplica las migraciones versionadas (migrations/*.sql, idempotentes vía la
    # tabla _migrations) ANTES de arrancar, para no crear tablas/columnas a mano
    # en Neon. run-migrations.mjs no hace nada si DATABASE_URL no es Postgres.
    startCommand: npm run db:migrate && npm run start -w @coda/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGINS
        value: https://www.codafinance.cl,https://codafinance.cl
      - key: CLIENT_URL
        value: https://www.codafinance.cl
      - key: DEBUG_ENDPOINTS
        value: false
      - key: DEMO_MODE
        # Cerrado: en producción no se acepta DEMO_PASSWORD para cualquier email
        # (la fuga que reportó la auditoría). Si necesitas demo, clona este
        # servicio en un environment de staging documentado y pon "true" solo ahí.
        value: false
      # Con DEMO_MODE=true, la contraseña demo (demo123) SOLO inicia sesión para
      # estos emails (lista separada por comas) — nunca para cuentas reales.
      # Alternativa: DEMO_EMAIL (uno solo). Default si no se define: demo@example.com.
      - key: DEMO_ALLOWED_EMAILS
        value: demo@example.com
      # Onboarding (consentimiento + KYC mock + 2FA). OFF por defecto. En "true"
      # exige 2FA antes de vincular un banco. Debe ir junto con VITE_ENABLE_ONBOARDING.
      - key: ENABLE_ONBOARDING
        value: false
      # DATABASE_URL must be set manually in Render Dashboard (Neon pooled URL)
      - key: DATABASE_URL
        sync: false
      # JWT Secret - set manually in Render Dashboard for security
      - key: JWT_SECRET
        sync: false  # Must be set manually in dashboard
      # Field-level encryption key (pseudonimización de columna, ver services/crypto/fieldEncryption.ts).
      # Generar con: openssl rand -base64 32. Requerida en producción (env.ts lanza si falta).
      - key: FIELD_ENCRYPTION_KEY
        sync: false  # Must be set manually in dashboard
      # Pepper del hash irreversible del RUT (seudonimización, ver services/crypto/identifierHashing.ts).
      # Generar con: openssl rand -base64 32. Requerida en producción (env.ts lanza si falta).
      # Secreto DISTINTO de FIELD_ENCRYPTION_KEY; rotarlo invalida todos los hashes.
      - key: RUT_HASH_PEPPER
        sync: false  # Must be set manually in dashboard
      # Redis del blueprint (coda-redis): store de OTP 2FA (TTL nativo), rate limiting
      # distribuido y colas BullMQ. Conectado por fromService — no requiere set manual.
      - key: REDIS_URL
        fromService:
          name: coda-redis
          type: keyvalue
          property: connectionString
      # Observability core. Metrics stay OFF unless explicitly enabled. If enabled
      # in production, METRICS_TOKEN is required and must be set manually.
      - key: METRICS_ENABLED
        value: false
      - key: METRICS_TOKEN
        sync: false
      # Optional Sentry error capture. Empty/unset DSN keeps Sentry disabled.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0
      # Auth cookie en producción. api.codafinance.cl permite una cookie
      # first-party/same-site; Bearer y token JSON se mantienen por compatibilidad.
      - key: AUTH_COOKIE_ENABLED
        value: true
      - key: AUTH_COOKIE_NAME
        value: coda_session
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      # Vacío a propósito: cookie host-only para api.codafinance.cl, sin Domain.
      - key: AUTH_COOKIE_DOMAIN
        value: ""
      - key: COOKIE_CSRF_ENABLED
        value: false
      # CSRF Origin/Referer check (CSRF-1). MANTENER false hasta validar; en "true"
      # exige Origin/Referer allowlisted en mutaciones cookie-auth. Skip Bearer/
      # empresas/auth-bootstrap/públicos/GET. Rollback: volver a false + redeploy.
      - key: CSRF_ENFORCE
        value: false
      # Email — REQUERIDO para 2FA OTP y reset de contraseña. Configura UN proveedor
      # (Resend preferido). Sin proveedor: 2FA falla cerrado (503) y forgot-password
      # no envía correo. Todos sync:false (set manual en el Dashboard, son secretos).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM     # remitente verificado, p.ej. "CODA <noreply@codafinance.cl>"
        sync: false
      # Alternativas a Resend (configurar solo si no se usa Resend):
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

  # Worker: procesa OCR/parseo PDF + scoring SFA encolado por POST /api/documents/upload
  # (ver src/queues/documentQueue.ts), separado del proceso web para que un pico de uploads
  # no compita por CPU con las requests HTTP normales.
  - type: worker
    name: coda-document-worker
    runtime: node
    region: virginia
    plan: starter  # free tier suspende el proceso por inactividad — los uploads encolados no se procesarían
    # Escalado del worker (#38): 1 instancia procesa con concurrencia = nº de cores (ver
    # documentWorker.ts). Si la cola se satura de forma sostenida (alerta coda_queue_waiting, #27),
    # subir numInstances — BullMQ reparte los jobs entre todos los workers sin configuración extra.
    numInstances: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run worker:start -w @coda/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # El worker también hashea el RUT al procesar uploads → necesita el pepper.
      - key: RUT_HASH_PEPPER
        sync: false
      - key: REDIS_URL
        fromService:
          name: coda-redis
          type: keyvalue
          property: connectionString
