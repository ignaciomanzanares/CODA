<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>CODA</title>

    <link rel="dns-prefetch" href="https://plausible.io" />
    <link rel="preconnect" href="https://coda-api-fplk.onrender.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA: instalable y pantalla completa en móvil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS: modo app, barra de estado y título -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CODA" />
    <script defer data-domain="codafinance.cl" src="https://plausible.io/js/script.js"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Chile Open-Data Analytics SpA",
      "alternateName": "CODA",
      "url": "https://www.codafinance.cl",
      "logo": "https://www.codafinance.cl/icons/icon-512x512.png",
      "description": "Plataforma de salud financiera personal y marketplace financiero digital para Chile.",
      "foundingDate": "2025-12",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Santiago",
        "addressRegion": "Región Metropolitana",
        "addressCountry": "CL"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CODA",
      "url": "https://www.codafinance.cl",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CLP"
      }
    }
    </script>
  </head>
  <body>
    <script>
      // Prevent FOUC: apply dark mode before first paint
      (function(){var t=localStorage.getItem("coda-theme");var d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);if(d)document.documentElement.classList.add("dark")})();
    </script>
    <div id="root">
      <div id="app-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;">
        <div style="text-align:center;">
          <div style="font-size:2rem;font-weight:700;color:#3b82f6;letter-spacing:0.05em;">CODA</div>
          <div style="margin-top:0.5rem;font-size:0.875rem;color:#94a3b8;">Cargando...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
