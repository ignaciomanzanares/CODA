# ============================================================
# CODA — stack de DESARROLLO (hot reload real)
#
#   docker compose up --build
#
#   API    → http://localhost:5000   (tsx watch)
#   Web    → http://localhost:5173   (vite dev + HMR)
#   Pg     → localhost:5433          (coda/coda, db coda)
#   Redis  → interno                 (activa la cola BullMQ + worker,
#                                     que el dev local sin Redis no ejercita)
#
# El código entra por bind mount; los node_modules vienen de la imagen
# (volúmenes nombrados tapan los del host — glibc/ABI del contenedor).
# Tras cambiar dependencias: docker compose down -v && docker compose up --build
# ============================================================
name: coda

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coda
      POSTGRES_PASSWORD: coda
      POSTGRES_DB: coda
    ports:
      - "5433:5432" # 5433 para no chocar con un Postgres del host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coda -d coda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: compila @coda/db (el dev del API lo importa desde packages/dist),
  # crea el schema si la BD está virgen (drizzle-kit push) y aplica migrations/.
  db-init:
    build:
      context: .
      target: dev
    command: sh -c "npm run build -w @coda/db && node docker/db-init.mjs"
    environment:
      # sslmode=disable explícito: tanto db/index.ts (runtime) como
      # drizzle.config.ts (drizzle-kit) agregan sslmode=require si falta
      # (pensado para Neon); el Postgres local no tiene TLS.
      DATABASE_URL: postgresql://coda:coda@postgres:5432/coda?sslmode=disable
      DATABASE_URL_MIGRATE: postgresql://coda:coda@postgres:5432/coda?sslmode=disable
    volumes: &dev-mounts
      - .:/app
      - node_modules:/app/node_modules
      - node_modules_api:/app/apps/api/node_modules
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_packages:/app/packages/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: dev
    command: npm run dev -w @coda/api
    environment: &api-env
      NODE_ENV: development
      PORT: "5000"
      # sslmode=disable: db/index.ts fuerza sslmode=require si falta (Neon)
      DATABASE_URL: postgresql://coda:coda@postgres:5432/coda?sslmode=disable
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes: *dev-mounts
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Procesa los uploads encolados (OCR/parseo/scoring) — con REDIS_URL presente,
  # POST /api/documents/upload responde 202 y el job cae aquí.
  worker:
    build:
      context: .
      target: dev
    command: npm run worker -w @coda/api
    environment: *api-env
    volumes: *dev-mounts
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: dev
    command: npm run dev -w @coda/web -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:5000
      # Descomentá si el HMR no detecta cambios (depende del filesystem):
      # CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes: *dev-mounts
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  node_modules:
  node_modules_api:
  node_modules_web:
  node_modules_packages:
