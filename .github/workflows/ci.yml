name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # apps/api resuelve @coda/db a packages/dist (ver apps/api/tsconfig.json
      # "paths") — sin este build, tsc --noEmit y los tests fallan por módulo
      # no encontrado.
      - name: Build packages (@coda/db)
        run: npm run build -w packages

      - name: Typecheck
        run: npm run check --workspaces --if-present

      # Los tests de @coda/api usan la DB SQLite de @coda/db
      # (packages/data/coda.db), que está gitignored y no existe en CI. Sin
      # schema, los tests que tocan tablas reales fallan con "no such table:
      # users". db:push crea el schema en SQLite (sin DATABASE_URL Postgres en el
      # entorno, drizzle.config resuelve a sqlite); --force es no-interactivo.
      - name: Initialize SQLite test schema
        run: |
          mkdir -p packages/data
          npm run db:push -w @coda/db -- --force

      - name: Test (@coda/api)
        working-directory: apps/api
        run: npx vitest run

      # El build del front (Vite puro, sin dependencias nativas) valida que los
      # cambios no rompan la compilación de la web.
      - name: Build (@coda/web)
        run: npm run build -w @coda/web
